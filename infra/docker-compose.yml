services:
  postgres:
    image: postgres:16
    container_name: tcc-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: twitter_cache
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tcc-redis
    ports:
      - "6380:6379"

volumes:
  pgdata:
