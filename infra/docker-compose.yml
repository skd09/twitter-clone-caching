services:
  postgres:
    image: postgres:16
    container_name: tcc-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: twitter_cache
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tcc-redis
    ports:
      - "6380:6379"

  redis-hot:
    image: redis:7
    container_name: tcc-redis-hot
    ports:
      - "6381:6379"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tcc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tcc-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    environment:
      # Local playground: skip the login wall entirely.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
volumes:
  pgdata:
